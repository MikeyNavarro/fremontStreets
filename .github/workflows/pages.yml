name: Test and deploy Fremont Streets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish before publishing the next main revision.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run simulation, geography, and game-state tests
        run: npm test

      - name: Run complete browser regression suite
        run: npm run test:e2e

      - name: Build production application
        run: npm run build

      - name: Test production files at the Pages subdirectory
        run: npm run test:production

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            test-results-production/
          retention-days: 7
          if-no-files-found: ignore

      # Pull requests exercise the same build and tests without publishing.
      - name: Upload tested production files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5

      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v5
